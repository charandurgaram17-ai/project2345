{% extends "base.html" %}

{% block title %}{{ title or 'Notice' }} — FarmDirect AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-5">
        <div class="display-1 fw-bold text-success mb-2">{{ code or '!' }}</div>
        <h3 class="fw-bold text-dark mb-2">{{ title or 'Notice' }}</h3>
        <p class="text-muted mb-4">{{ message or 'An unexpected condition was encountered.' }}</p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('marketplace') }}" class="btn btn-farm-primary">
            <i class="bi bi-shop me-1"></i>Return to Marketplace
          </a>
          <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
            Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
